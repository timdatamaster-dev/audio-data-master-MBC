<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Identifier Bahan Baku</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      width: 320px;
      text-align: center;
    }
    .card h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      color: #555;
      padding: 8px;
    }
    td {
      text-align: right;
      font-weight: bold;
      padding: 8px;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Identifier Bahan Baku</h2>
    <table>
      <tr>
        <th>KODE BARANG</th>
        <td>ABC123</td>
      </tr>
      <tr>
        <th>NAMA BARANG</th>
        <td>Gula Pasir</td>
      </tr>
    </table>
  </div>
</body>
</html>
